name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pest 3 + Testbench 10 — Laravel 12, including PHP 8.2
          - php: '8.2'
            laravel: '12.*'
            pest: '^3.8'
            plugin: '^3.2'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '12.*'
            pest: '^3.8'
            plugin: '^3.2'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '12.*'
            pest: '^3.8'
            plugin: '^3.2'
            testbench: '^10.0'
          # Pest 4 + Testbench 11 — Laravel 13 (PHP 8.3+)
          - php: '8.3'
            laravel: '13.*'
            pest: '^4.4'
            plugin: '^4.1'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '13.*'
            pest: '^4.4'
            plugin: '^4.1'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.plugin }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-progress --no-interaction --no-ansi

      - name: Pest
        run: vendor/bin/pest --colors=always

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: php-cs-fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
